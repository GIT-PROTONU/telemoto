[workspace]
name = "telamoto"
version = "0.1.0"
description = "ROS2 Jazzy workspace for UR10 CB3.1"
channels = [
    "robostack-jazzy",
    "robostack-staging",
    "conda-forge",
]
platforms = ["linux-64"]

# ---------------------------------------------------------------------------
# ROS2 middleware tuning (applies to every task in the env)
# All nodes (move_group, servo_node, ur_servo_controller, RViz) run on THIS
# host, and the robot link is raw TCP (RTDE/URCap sockets, not DDS) — so we
# pin DDS to localhost for deterministic, jitter-free loopback transport.
#   - CycloneDDS: lower/steadier latency than the default for realtime control.
#   - LOCALHOST discovery + fixed domain: no network discovery traffic/jitter,
#     and no cross-talk with other ROS2 hosts on the LAN.
# To revert, comment this block out (falls back to rmw_fastrtps_cpp).
# ---------------------------------------------------------------------------
[activation.env]
RMW_IMPLEMENTATION            = "rmw_cyclonedds_cpp"
ROS_DOMAIN_ID                 = "42"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"

# ---------------------------------------------------------------------------
# Core ROS2 + robot stack
# ---------------------------------------------------------------------------
[dependencies]
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-desktop           = "*"
ros-jazzy-ur-robot-driver   = "*"
ros-jazzy-ur-description    = "*"
ros-jazzy-ur-moveit-config  = "*"
ros-jazzy-ur-calibration    = "*"
ros-jazzy-moveit             = "*"
ros-jazzy-moveit-planners-ompl = "*"
ros-jazzy-trac-ik-kinematics-plugin = "*"   # IK for planned moves (kinematics.yaml)
ros-jazzy-ros2-control       = "*"
ros-jazzy-ros2-controllers   = "*"
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-xacro              = "*"
ros-jazzy-rviz2              = "*"
colcon-common-extensions     = "*"
colcon-mixin                 = "*"
aiortc                       = "*"   # WebRTC datachannel = the browser's only UDP
fsspec                       = ">=2023.1.0,<=2026.2.0"   # cap for lerobot[dataset] (hits conda 2026.7.0)

# ---------------------------------------------------------------------------
# Build tools
# ---------------------------------------------------------------------------
cmake        = ">=3.22"
ninja        = "*"
compilers    = "*"
pkg-config   = "*"

# ---------------------------------------------------------------------------
# Dev helpers
# ---------------------------------------------------------------------------
pre-commit   = "*"
clang-format = "*"

# ---------------------------------------------------------------------------
# LeRobot ML environment (isolated so its PyPI deps never disturb the ROS solve)
# Runs on: pixi run --environment leerobot <task>   (see [tasks.leerobot-*])
# ---------------------------------------------------------------------------
[feature.lerobot.dependencies]
lerobot                      = "*"   # imitation learning (record/collect, train ACT/Diffusion, deploy)

[feature.lerobot.pypi-dependencies]
datasets                     = ">=4.7.0,<5.0.0"   # lerobot[dataset] (HF datasets)
fsspec                       = ">=2023.1.0,<=2026.2.0"   # datasets pin clash with conda 2026.7.0
torchcodec                   = "*"                  # lerobot[dataset] video encoding
accelerate                   = "*"                  # lerobot[training]

[workspace.conda-pypi-map]
conda-forge = { mapping = { compilers = false, "gcc_linux-64" = false, "gxx_linux-64" = false, "pkg-config" = "pkgconfig" }, same-name-heuristic = false }

[environments]
lerobot = ["lerobot"]

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
[tasks]
# Build the workspace (incremental)
build = "colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -GNinja"

# Build a single package  (usage: pixi run build-pkg PKG=telamoto_hardware)
build-pkg = "colcon build --symlink-install --cmake-args -GNinja --packages-select $PKG"

# Clean build artefacts
clean = "rm -rf build install log"

# Source the install overlay and drop into a shell
shell = "bash --rcfile <(echo 'source $CONDA_PREFIX/setup.bash && source install/setup.bash 2>/dev/null || true')"

# Digital twin — UR10 with fake hardware + MoveIt2 + RViz2 (no robot needed)
twin = { cmd = "bash -c 'source install/setup.bash && ros2 launch telamoto_bringup digital_twin.launch.py'", depends-on = ["build"] }

# Real robot via the custom reverse-interface controller (no ur_robot_driver):
# ur_rtde_joint_pub reads /joint_states, ur_servo_controller does 125 Hz servoj.
twin-real = { cmd = "bash -c 'source install/setup.bash && ros2 launch telamoto_bringup digital_twin.launch.py use_mock_hardware:=false robot_ip:=192.168.10.2'", depends-on = ["build"] }
calibrate = { cmd = "bash -c 'source install/setup.bash && ros2 launch ur_calibration calibration_correction.launch.py robot_ip:=192.168.10.2 target_filename:=$(pwd)/src/telamoto_bringup/config/ur10_calibration.yaml'" }

# Open RViz with MoveIt2 only (controllers must already be running)
rviz = "bash -c 'source install/setup.bash && ros2 launch telamoto_bringup moveit_rviz.launch.py'"

# Open the motion tuning web page (served by ur_servo_controller while twin-real
# runs). Speed / Stiffness / Smoothness sliders — also reachable from a phone at
# http://<this-pc-ip>:8080.
tune = "xdg-open http://localhost:8080"

# List available ROS2 nodes
nodes = "ros2 node list"

# LeRobot teach node — records teleop demos as a LeRobotDataset (needs the
# `lerobot` env: lerobot + the full ROS2 stack). Usage:
#   pixi run record --ros-args -p dataset_root:=~/.ros/teleocorpus -p task:=grab
#   ros2 service call /lerobot_record/start std_srvs/srv/Trigger   # start ep
#   ros2 service call /lerobot_record/stop  std_srvs/srv/Trigger   # stop + save
record = "pixi run --environment lerobot python src/telamoto_bringup/scripts/lerobot_record.py"
train = "pixi run --environment lerobot python -m lerobot.scripts.train --dataset.repo_id=telamoto/teleocorpus"
eval = "pixi run --environment lerobot python -m lerobot.scripts.eval --dataset.repo_id=telamoto/teleocorpus"
