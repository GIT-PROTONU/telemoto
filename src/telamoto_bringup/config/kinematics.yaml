# IK solver configuration for the UR10 manipulator group.
# KDL is the safe default; swap for bio_ik or trac_ik for better
# performance in constrained workspaces.
manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
  kinematics_solver_attempts: 3
