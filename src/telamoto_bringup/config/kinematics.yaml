# IK solver for the UR10 manipulator group (planned moves only — the WASD jog
# uses speedl, so Cartesian→joint happens onboard the robot, and Servo's
# sentinel keeps its own kinematics config: see ur_moveit.launch.py).
#
# TRAC-IK replaces KDL: KDL's Newton-Raphson stalls on joint-limit-constrained
# poses, which is exactly where planning inside the collision cage lives.
# solve_type Distance returns the solution closest to the seed state — no
# surprise elbow flips on planned moves (costs the full timeout per solve).
# Group name must match the upstream SRDF group: ur_manipulator.
ur_manipulator:
  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
  kinematics_solver_timeout: 0.005
  solve_type: Distance
  epsilon: 1.0e-5
  position_only_ik: false
