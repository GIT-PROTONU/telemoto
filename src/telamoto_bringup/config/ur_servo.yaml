# MoveIt Servo config for the UR10 (Jazzy moveit_servo 2.12, new param schema).
# Loaded under the "moveit_servo" namespace via launch_param_builder.
#
# ROLE: kinematic SENTINEL for the WASD jog — servo_node receives the jog twist on
# ~/delta_twist_cmds and keeps evaluating the kinematics; ur_servo_controller uses
# its ~/status (singularity/joint-bound codes) to gate the speedl command it sends
# the robot. Servo's own JointTrajectory output is NOT used for motion (the robot
# executes the Cartesian command onboard via URScript speedl).

publish_period: 0.004           # servo output rate [s] — faster = lower latency
max_expected_latency: 0.03

command_in_type: "speed_units"  # twist values are m/s and rad/s
# In speed_units mode `scale.linear/rotational` are the MAX linear/angular
# velocities (a hard cap on the incoming twist), not just unitless scaling. Keep
# linear ≥ the jog slider max (JOG_SPEED_MAX = 0.5) with headroom so a full-speed
# twist is never clamped — a clamped twist would skew the sentinel's assessment.
scale:
  linear: 0.65                  # m/s cap — jog max + headroom
  rotational: 1.0               # rad/s cap
  joint: 0.5

# Servo's joint output is unused (sentinel role) but a valid output config is
# required; nothing subscribes to this topic.
command_out_type: trajectory_msgs/JointTrajectory
command_out_topic: /telamoto/servo_command
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

# Smoothing is pointless in the sentinel role (output unused) and previously
# introduced a standstill resonance when it drove the arm; keep OFF.
use_smoothing: false

# move_group owns the planning scene; servo just reads it.
is_primary_planning_scene_monitor: false
check_octomap_collisions: false

move_group_name: ur_manipulator

# Singularity handling (Jacobian condition number). SAFETY-CRITICAL: if these
# are too high, Servo never decelerates near a singularity and the Jacobian
# inverse amplifies a small twist into a huge JOINT velocity → the arm shoots.
# (It previously sat at 30/60, which on a UR is effectively disabled.) Keep
# protection ON: decelerate from 20, hard-stop at 40. The MAX_JOG_QD cap in
# ur_servo_controller.py is the backstop. Tune up cautiously only if it halts
# in genuinely well-conditioned poses — never disable.
lower_singularity_threshold: 20.0
hard_stop_singularity_threshold: 40.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margins: [0.1]

cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status

# Collision checking off for v1 (operator-supervised jogging); enable later.
check_collisions: false
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
